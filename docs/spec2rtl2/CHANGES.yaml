- id: opaque-pins-selectors
  date: 2026-09-05
  status: fixed
  found: "building new_mul: `obligations: enable/isolation input(s) held active for the value path: dpSize_M1, high_M1, low32_M1, sgnOp_M1, subOp_M1, unsgn_M1` -- the directive pinned every one-bit input that gates data, so the product obligation was computed at ONE control corner"
