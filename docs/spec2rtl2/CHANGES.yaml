- id: F32
  date: 2026-09-03
  status: fixed
  found: field, ve144 (the reporter's unrolled grid at side 3)
  what: "the bits->word bridge of a per-bit signal is ONE rule joining every bit: 2^N ground instances whenever the bits are free at grounding (a register-derived signal under a symbolic power-on); a 36-bit count array never finished, a 20-bit probe was killed at 120 s with 1.1 M instances -- and the bridge was emitted for every indexed signal whether or not anything read the word"
  why: "the cost is dynamic, not static: a concrete power-on with pinned inputs determines every bit and grounds the same rule in one instance (goldschmidt_cds's 32-bit q_tilde), so a static refusal would have been wrong -- the first cut refused it and broke that example"
  fix: "above a budget (2^20): a word no rule of the design reads is NOT assembled and a constant slice/bit select reads its bits (2^w, not 2^N); a word some rule reads is assembled with its cost named as a WARNING; a port's word is always assembled (read from outside); the decision reads the emitted rules at each mode's finalisation (flat writes the bridge before its comb rules, modular after) so both modes agree by construction; the per-bit facts ride on the shape map and the ctx's used-set (Fix-42: first-class data, no new argument through 44 call sites). On the way: modular's rule builder RECORDED problems and warnings and never RETURNED them -- flat counted them, modular did not (the two-emitter split); now returned and merged"
  gate: [test_f32_word_bridge_budget, "sweep:packed_2d_constant_element_select_above_budget"]
  docs: [TOOL, SUITE A.10, LEARNINGS, JOURNAL]
  note: "the budget is per RULE; the single-valuedness check joins a word's candidates PAIRWISE, so an assembled 16-bit word under a free power-on is already 2^32 there -- a lower budget (about 10 bits) is the refinement to consider, recorded rather than applied because it would touch many corpus artifacts for no semantic change; and scripts/scenario_budget.py does not count a free power-on as free (see scenario-budget-xinit)"

