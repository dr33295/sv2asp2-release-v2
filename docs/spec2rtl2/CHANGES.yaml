  why: "the directive's pinning rule cannot tell an enable (whose active value is the only interesting one) from a selector (whose every value is); the corners fall to the round trip and to Lean, which is honest but weaker than the runner could be. And the same distinction is a GROUNDING wall the other way: a selector left FREE (no directive, or not wired to an ite at the top of a data def) forks the term family of every net that reads it, and the grounder does not know the readers share one bit -- new_mul's 32-row Booth array grounded 2^rows candidates for one sum (66k rules at 2 digits, no end at 4)"
