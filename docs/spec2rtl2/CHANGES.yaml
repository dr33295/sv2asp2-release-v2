  what: "the MIT bundle carries the language's COMPILER (src/sv2asp/aspfirst2/dsl/ and lib/dsl/grammar.ebnf) and, since the 2026-09-11 narrowing, the spec2rtl-dsl skill as well; what is held back is the specifications WRITTEN in the language (rvMissq.cnl, its generated core, fifo.spec)"
  why: "the user's ruling -- 'do not make the dsl into mit licence', then 'put the compiler alone into the mit one', then 'dont make it lose the spec2rtl-dsl skill'; one script built both lines with no notion of withholding by line, so a licensing decision had no mechanism behind it"
  fix: "MIT_WITHHOLD in scripts/build_dist.py, BUNDLE-relative paths, applied by the assembly and asserted independently by the safety gate. The grammar is deliberately not withheld: the parser is built from it at import. bootstrap(license) is one text for both lines again now that nothing it names is withheld, and is kept as a function so the next withhold touching a name it uses changes it rather than discovering it"
