    thresholds as parameter expressions (liveCount < COUNTWIDTH(DEPTH), never a baked
    number), human names with ZERO hoisted wires, no sigil in any identifier. ROUNDTRIP
    OK: authored ASP, printed SV translated back, Icarus agreeing on all 2679 definite
    samples.'
