    by: 'the user, in conversation 2026-09-01 ("reapprove and push to remote") -- re-approving after the reset review regenerated these three artifacts'
  explained: 'The RTL, to every stated requirement: module rvMissq with parameters
    DEPTH, DEMANDRESERVE, MAXOUTSTANDINGFETCHES, ADDRESSWIDTH, DATAWIDTH, TAGWIDTH,
    COUNTWIDTH -- packed per-entry arrays, GROUPED generate-for blocks (the CAM cluster,
