    digest: sha256:05ca16e9c96dfbae6c94fa3b1ca7c0d7473a89c021f36d74e90a7d4572fdbb22
    by: the user, in conversation 2026-08-31 ("approve and then proceed") -- the core
      regenerated by the current desugarer byte-identical to the first run's
  explained: 'The controlled English: your structured-English draft verbatim, with
    the three recorded corrections (three `already`s removed as refused noise; the
    lift scenario gained `E @still exists` per the lifetime rule; the seventeen structural
    keywords carry their @ sigils per the sigil rule). Sigil check clean. The core
    regenerated fresh by TODAYS desugarer -- 249 lines, byte-identical to the first
    runs committed core, so the surface tooling that changed since (single grammar
    source, file-derived matchers) preserves every meaning. The cross-file checker
    against the approved signature: clean.'
- name: contract
  artifact: spec.lp
  state: approved
  approved:
    at: '2026-09-02'
    digest: sha256:311a5f5445a5d4b12a47287b5b018ca3fb79f25e5208a32539bef3961132fcc2
    by: 'the user, in conversation 2026-09-02 ("clear and approve and then run")
      -- re-approving after the single-valuedness monitors were added'
  explained: 'GENERATED by the compiler from the approved rvMissq.cnl + rvMissq.yaml
    (the user: the next step generates the spec.lp), and REGENERATED after the naming
    ruling: every auxiliary atom is named for its declaration and role in lowerCamelCase
    (allocateDemandCreated, forwardIsCorrectBody, fillsAnswerFetchesFound), every
    value variable for what it samples (RAddress, EntryTag, LiveEntries -- ASP requires
    the capital), numbered gensyms gone. 296 lines; one by-design refusal (memoryEventuallyAnswers:
    s_eventually is an obligation). Verified: grounds and solves; the Stage-5 differential
    holds the renamed artifact to the reference interpreter over the trace batch with
    all 17 property monitors fired and zero disagreements -- and the renaming itself
    was caught making a real error on the way (a helper collided with the reserved
    main name and negated itself; the split-head check and the differential now guard
    it). Mount manifest unchanged: entryExists, demanding, wantsFetch, inFlight, filled,
    forwarded, corresponds, entryAddress, entryTag, lineData, liveEntries, inFlightCount.'
- name: design
  artifact: l1.lp
  state: approved
  approved:
    at: '2026-09-01'
    digest: sha256:efb404130a9ff43825e169de172836a1a0500cafa058521af3ed5c2450f150c0
    by: 'the user, in conversation 2026-09-01 ("reapprove and push to remote") -- re-approving after the reset review regenerated these three artifacts'
  explained: 'REVISED after the user''s arbitration review: the rotating arbiter is
    now written ONCE (rot_arbiter in generate.py) and instantiated for BOTH ports
    -- the forward side and the memory-request side, whose `choose fairly among eligible
    entries` obligation the previous design met with fixed lowest-index priority that
    could starve a high slot. Also: the 1-bit slot state moved to sum-of-products
    hold/set (set | hold & ~clear) and the popcount chains add the valid bit directly
    -- both changes forced by the round trip, which refused the nested-ternary spellings
    (one real translator defect fixed as F28, one recorded open). Lint clean; the
    certificate re-closed at K=1 untouched. And the user''s parameter review: the
    three thresholds are PARAMETER EXPRESSIONS now (lt(liveCount, k(depth, ...)),
    k(sub(depth, demandReserve), ...), k(maxOutstandingFetches, ...)) -- the print
    reads liveCount < COUNTWIDTH''(DEPTH), never a baked number; the printer learned
    the inline size-cast for a parameter expression at a named width.'
- name: certificate
  artifact: CERTIFICATE.md
  state: approved
  approved:
    at: '2026-09-02'
    digest: sha256:b09b0d4d5f9dbaa7417c8f9ebacf0bfa09c2d1aeb4083c70d33be88671a3fc8d
    by: 'the user, in conversation 2026-09-02 ("clear and approve and then run")
      -- re-approving after the single-valuedness monitors joined the property set'
  explained: 'RE-RUN with the five single-valuedness monitors in the set: base OK,
    all 44 monitors INDUCTIVE at K=1 (was 39), no ghost state, NO invariants and no
    increase in K, all six scenarios -- both producers (spec.lp compiled; specFv.lp
    the FV stand-in), and the second configuration still DISCRIMINATES. Logs beside:
    certificate.log, certificateFreeReset.log, certificateFv.log,
    certificateSecondPoint.log. The five new monitors say a window holds ONE value at
    an instant -- true here all along, since every window is mounted from a single
    val/3 atom, but true by accident rather than by statement until now; a linkage
    mounting one window from two rules would have MASKED violations, because a claim
    asks whether SOME value matches. Fairness CHECKING remains the Phase-3 item.'
