entry: rv_missq
steps:
- name: specification
  artifact: SPECIFICATION.md
  state: approved
  approved:
    at: '2026-08-31'
    digest: sha256:6282c99366bcfd7c113d0242fa2fe665afb18481ef07f3d49ced9966527db9d7
    by: 'the user, in conversation 2026-08-31 ("okay approve and proceed") -- the
      regeneration run, rung 1: the specification kept verbatim from the first run'
  explained: 'An instruction-fetch miss queue, respecified as: AN ENTRY IS A LINE,
    not a request. Demand and prefetch misses share one queue of depth entries; a
    demand for a prefetched line LIFTS that entry in place; a prefetch for a covered
    line merges; a second demand for an already-demanded line stalls the fetch pipe
    instead of allocating. Demand is served first at the memory port, at most maxOutstandingFetches
    enquiries are in flight, demandReserve slots stay free so a demand always has
    room, and a redirect downgrades every demand entry to prefetch. Filled demand
    entries are forwarded exactly once, tag and data correct, and freed the next cycle;
    filled prefetch entries end quietly. P1-P17 with A1-A5 (A5 withdrawn in place,
    A3 not transcribed), each promise owning a declaration in the traceability table.'
- name: signature
  artifact: rvMissq.yaml
  state: approved
  approved:
    at: '2026-08-31'
    digest: sha256:61ac669a71c93f9dc975a3acf59e3c102813952f795c4e09372ac6d8a8bfb7a6
    by: the user, in conversation 2026-08-31 ("ok approve and continue") -- with the
      4/2 defaults as the proven configuration and depth parametric in the RTL, per
      the run requirements recorded in the worklist
  explained: 'The symbol table: five interfaces (request readyValid receives, redirect
    validOnly receives, memoryRequest readyValid sends with payload reprioritisable,
    fill validOnly receives, forward validOnly sends), the bare fetchStall level wire,
    19 ports each with direction/width/clock/interface/role, six parameters, clk posedge,
    resetN active-low once-only. role is the control/data split: addresses, tags and
    data are opaque (tokens through the equality theory, never enumerated); requestIsDemand
    is the one numeric payload bit. ONE DECISION FLAGGED: defaults are depth=4, maxOutstandingFetches=2
    -- the BUILT configuration, per the incident rule -- while the specification table
    suggests 8/4. Approving this rung approves building at 4/2 again.'
